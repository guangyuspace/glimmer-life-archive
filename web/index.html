<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030407">
  <title>微光：撐傘的人</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <section id="archiveScreen" class="screen archive-screen" aria-label="生命檔案館">
      <div class="archive-art" aria-hidden="true"></div>
      <canvas id="archiveThree" class="archive-three" aria-hidden="true"></canvas>
      <div class="archive-sky" aria-hidden="true"></div>
      <div class="archive-haze" aria-hidden="true"></div>

      <div class="archive-copy">
        <p class="kicker">生命檔案館</p>
        <h1 id="archiveTitle">微光</h1>
        <p id="archiveSubtitle" class="archive-subtitle">每一次開始，都會走進一段未曾參與的人生。</p>
      </div>

      <div class="archive-centerpiece">
        <button id="memoryOrb" class="memory-orb" type="button" aria-label="開始隨機故事">
          <span class="orb-core" aria-hidden="true"></span>
          <span class="orb-ring" aria-hidden="true"></span>
        </button>
        <button id="startRandomButton" class="start-random-button" type="button">開始</button>
        <p id="archiveStatus" class="archive-status">讀取故事庫中</p>
      </div>

      <section class="experience-panel" aria-label="你的經歷">
        <div class="experience-header">
          <h2>經歷</h2>
          <span id="experienceCount">0</span>
        </div>
        <div id="experienceList" class="experience-list"></div>
      </section>

      <p id="archiveHint" class="archive-hint"></p>
      <p id="archiveError" class="archive-error" role="alert"></p>
    </section>

    <main id="storyScreen" class="screen story-screen hidden" aria-label="故事播放器">
      <div class="story-stage" id="storyStage">
        <div id="panelFrame" class="panel-frame">
          <img id="panelImage" alt="" draggable="false">
          <div id="wipeTrace" class="wipe-trace" aria-hidden="true"></div>
          <div id="panelPlaceholder" class="panel-placeholder">
            <span>這一幕還在等待光</span>
          </div>
        </div>

        <section class="text-panel" aria-live="polite">
          <div class="scene-progress" aria-hidden="true">
            <span id="sceneCounter">1 / 1</span>
            <i><b id="sceneProgressFill"></b></i>
          </div>
          <p id="chapterLabel" class="chapter-label"></p>
          <p id="storyText" class="story-text"></p>
          <div class="interaction-row">
            <p id="interactionPrompt" class="interaction-prompt"></p>
            <div id="holdMeter" class="hold-meter" aria-hidden="true">
              <span id="holdFill"></span>
            </div>
          </div>
        </section>
      </div>
    </main>

    <section id="endingScreen" class="screen ending-screen hidden" aria-label="結尾">
      <div class="ending-black"></div>
      <p id="endingCopy" class="ending-copy"></p>
      <button id="returnArchiveButton" class="return-archive-button" type="button">回到檔案館</button>
      <button id="writeStoryButton" class="write-story-button" type="button">留下你的故事</button>
    </section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
